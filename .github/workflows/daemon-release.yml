# Release the hub daemon: push a `daemon-v*` tag and this builds the standalone binaries and
# attaches them to a GitHub release, sha256s included. These artifacts are what the desktop app's
# installer grabs (pinned by version + hash) — the app never compiles the hub (owner, 2026-08-19:
# "It should build, have its own CI, all stand alone. The core application will then grab a hub
# version to include in its installer, that's already compiled.")
#
# GitHub-hosted runners on purpose: this repo is public so they are free, and nothing here holds a
# signing key that would demand a self-hosted box.
name: Release hub daemon

on:
  push:
    tags: ['daemon-v*']
  # BUILD WITHOUT PUBLISHING. Until 2026-08-20 a tag was the ONLY way to get an installer out of
  # this workflow, and that is the direct cause of two bad releases in one day: daemon-v0.3.0
  # shipped a Windows installer that had never been built around a real PE (the ci.yml gate feeds
  # makensis a Linux ELF renamed .exe, so it proves the SCRIPT compiles and nothing more), and
  # v0.3.2's installer self-check could not be exercised before tagging for the same reason.
  #
  # Dispatched runs build everything a tag does — including the installer and the macOS pkg — and
  # upload it as an ARTIFACT. No GitHub release, no `latest` link moved, nothing the app can fetch.
  # This is what runner-smoke.yml is for the desktop app: the cheap place to find out.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: brvg-hub-windows-x64.exe
          - os: macos-latest
            artifact: brvg-hub-macos-universal
          # Convergence ruling (owner 2026-08-19): the Rust daemon is THE full hub — desktop AND
          # containers — and the TS hub stops growing. The linux binary is what a container image
          # or a bare Linux box runs.
          - os: ubuntu-latest
            artifact: brvg-hub-linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: daemon
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # On a TAG this is the guard that stops a release lying about its version. On a DISPATCH there
      # is no tag to check, so the crate version is simply taken as the truth — a build-only run has
      # nothing to lie to.
      - name: Resolve the version (and on a tag, refuse to disagree with the crate)
        id: ver
        run: |
          CRATE_VER=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_VER="${GITHUB_REF_NAME#daemon-v}"
            [ "$TAG_VER" = "$CRATE_VER" ] || {
              echo "::error::tag says $TAG_VER but Cargo.toml says $CRATE_VER — a release must not lie about its version" >&2
              exit 1
            }
            echo "ver=$TAG_VER" >> "$GITHUB_OUTPUT"
          else
            echo "ver=$CRATE_VER (build-only, no release)"
            echo "ver=$CRATE_VER" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --release
          cp target/release/brvg-hub.exe "${{ matrix.artifact }}"
          # The notification-area monitor rides in the installer rather than shipping as its own
          # download: on its own it is useless, since it exists to watch a hub.
          cp target/release/brvg-hub-tray.exe brvg-hub-tray-windows-x64.exe

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          cp target/release/brvg-hub "${{ matrix.artifact }}"

      - name: Build (macOS, universal)
        if: runner.os == 'macOS'
        # Both architectures, lipo'd — the same reasoning as the app's universal build: the owner's
        # Macs are Intel, CI's are Apple Silicon, and one artifact must serve both.
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output "${{ matrix.artifact }}" \
            target/aarch64-apple-darwin/release/brvg-hub \
            target/x86_64-apple-darwin/release/brvg-hub
          lipo -archs "${{ matrix.artifact }}"
          # The menu-bar monitor, universal too — one build serves both the owner's Intel Macs and
          # CI's Apple Silicon. It rides inside the pkg, not as its own download: on its own it is
          # useless, since it exists to watch a hub.
          lipo -create -output brvg-hub-tray \
            target/aarch64-apple-darwin/release/brvg-hub-tray \
            target/x86_64-apple-darwin/release/brvg-hub-tray

      - name: Build the macOS installer pkg
        if: runner.os == 'macOS'
        # The pkg is the "separate installer" of the owner's 2026-08-19 ruling: payload under
        # /Library/Application Support/BoatRVGuardian/bin (the same shared root the daemon's own
        # config uses — root-owned, exactly what the app could never write and the service should),
        # plus a LaunchDaemon so it starts at boot before any login. UNSIGNED, like everything else
        # this project ships so far — macOS will warn on first open; right-click → Open works.
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          ROOT=pkgroot
          mkdir -p "$ROOT/Library/Application Support/BoatRVGuardian/bin" "$ROOT/Library/LaunchDaemons" "$ROOT/Library/LaunchAgents" scripts
          cp "${{ matrix.artifact }}" "$ROOT/Library/Application Support/BoatRVGuardian/bin/brvg-hub"
          chmod 755 "$ROOT/Library/Application Support/BoatRVGuardian/bin/brvg-hub"
          # The tray binary sits beside the daemon; 755 so the logged-in user (the hub-lite runs as
          # them, not root) can execute it.
          cp brvg-hub-tray "$ROOT/Library/Application Support/BoatRVGuardian/bin/brvg-hub-tray"
          chmod 755 "$ROOT/Library/Application Support/BoatRVGuardian/bin/brvg-hub-tray"
          cp macos/com.sc4tech.brvg-hub.plist "$ROOT/Library/LaunchDaemons/"
          cp macos/com.sc4tech.brvg-hub-tray.plist "$ROOT/Library/LaunchAgents/"
          cp macos/postinstall scripts/
          pkgbuild --root "$ROOT" --scripts scripts \
            --identifier com.sc4tech.brvg-hub --version "$VER" \
            --install-location / brvg-hub-macos.pkg
          pkgutil --check-signature brvg-hub-macos.pkg || true

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: brvg-hub-macos.pkg
          path: daemon/brvg-hub-macos.pkg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: daemon/${{ matrix.artifact }}
          if-no-files-found: error

      # Windows only, and NOT published as a release asset -- the release job consumes it to build
      # the installer. if-no-files-found: error so a build that silently stopped producing it fails
      # here rather than producing an installer with no monitor in it.
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: brvg-hub-tray-windows-x64.exe
          path: daemon/brvg-hub-tray-windows-x64.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Checkout FIRST: actions/checkout cleans its destination, so it would delete the downloaded
      # artifacts if it ran after them. It is here for daemon/windows/installer.nsi, nothing else.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # Build the hub's own Windows installer HERE, in the release job, rather than on the Windows
      # leg -- because this is where the released .exe already sits, so the installer is guaranteed
      # to wrap the exact binary this release publishes, and its hash lands in the same SHA256SUMS.
      #
      # ⚠️ WHY THIS STEP EXISTS AT ALL: #21 added installer.nsi and #22 added a compile gate whose
      # comment says it "only SHIPS from a daemon-v* tag" -- but no step was ever added here to
      # ship it. daemon-v0.2.0 therefore carries no installer, and the app's increment-C bundling
      # is blocked on an asset no release would ever have produced.
      #
      # ⚠️ The ci.yml gate proves the SCRIPT compiles; it feeds makensis a Linux ELF renamed .exe,
      # so it cannot prove the installer works. This step is the first that wraps a real PE.
      #
      # makensis cross-builds on Linux (same toolchain the gate uses). Paths mirror the gate
      # exactly -- NSIS resolves `File` and `OutFile` against the SCRIPT's directory, which is why
      # the binary is staged into windows/ and the output appears there too.
      - name: Version for the artifact name
        id: relver
        run: echo "ver=$(grep -m1 '^version = ' daemon/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Build the Windows installer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y nsis
          cp brvg-hub-windows-x64.exe daemon/windows/brvg-hub.exe
          cp brvg-hub-tray-windows-x64.exe daemon/windows/brvg-hub-tray.exe
          # -WX for the same reason as the ci.yml gate: NSIS recovers from an unknown $VARIABLE by
          # dropping it, so a warning here is a shipped installer that quietly targets the wrong
          # path. That is how daemon-v0.3.0 went out. Fail the release instead.
          (cd daemon && makensis -WX -V2 windows/installer.nsi)
          mv daemon/windows/brvg-hub-windows-setup.exe .
          echo "installer: $(stat -c%s brvg-hub-windows-setup.exe) bytes"

      - name: Checksums
        run: |
          # The tray binary is an INPUT to the installer, not a release asset -- publishing it
          # would invite someone to download a monitor with no hub to monitor. Remove it before the
          # glob sees it, or it lands in SHA256SUMS and in the release.
          rm -f brvg-hub-tray-windows-x64.exe
          sha256sum brvg-hub-* > SHA256SUMS
          cat SHA256SUMS
      # BUILD-ONLY RUNS STOP HERE. Everything above has produced real artifacts — binaries, the macOS
      # pkg, the Windows installer, SHA256SUMS — so a dispatched run is a full rehearsal that a human
      # can download and actually RUN. What it deliberately does NOT do is publish: no release, no
      # moved `latest` link, so nothing the desktop app fetches can change from a test build.
      - name: Upload the build for testing (dispatch only — publishes nothing)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: hub-build-${{ steps.relver.outputs.ver }}
          path: |
            brvg-hub-*
            SHA256SUMS
          if-no-files-found: error

      - name: Create the release
        # ⚠️ THE GUARD THAT KEEPS A TEST BUILD FROM SHIPPING. Without it, a dispatched run would cut
        # a release named after a branch and — because of the --latest below — hijack the stable
        # link every "Install the hub" click follows.
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --latest EXPLICITLY: the desktop app installs the hub through the stable
          # `releases/latest/download/…` links (owner 2026-08-19: no version pin — "why possibly
          # install an old version"). Those links follow whichever release is MARKED latest, so a
          # daemon release must always claim the mark — and if this repo ever grows another release
          # family (hub-lite, TS hub), those must pass --latest=false or they will hijack the app's
          # hub download.
          gh release create "$GITHUB_REF_NAME" brvg-hub-* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --latest \
            --title "Hub daemon ${GITHUB_REF_NAME#daemon-}" \
            --notes "Standalone BRVG hub daemon. Verify downloads against SHA256SUMS."
