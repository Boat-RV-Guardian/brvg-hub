# Validation for the Home Assistant integration. Separate from ci.yml because it shares nothing with
# the collectors — different language, different toolchain, and a push that only touches the hub
# should not spend minutes on hassfest.
#
# hassfest is Home Assistant's OWN manifest/translation validator: it is what catches a bad
# iot_class, a strings.json that has drifted from the entities, or a manifest key HA has since
# renamed. HACS validation checks what the store requires of a repository. Between them they are the
# gate this component would otherwise not have.
name: home-assistant

on:
  push:
    branches: [main]
    paths: ['custom_components/**', 'tests/**', '.github/workflows/home-assistant.yml', 'hacs.json', 'pytest.ini', 'requirements_test.txt']
  pull_request:
    paths: ['custom_components/**', 'tests/**', '.github/workflows/home-assistant.yml', 'hacs.json', 'pytest.ini', 'requirements_test.txt']

# HYG-1, 2026-08-30 security review. Without this the workflow token inherits the repository's
# DEFAULT scope, which on an older repo is read/write to everything — and none of the steps below
# writes anything. brvg-hub is PUBLIC, so its two workflows are the ones where an over-scoped token
# is worth the least to keep. Raise this deliberately if a step ever needs to push, tag or release.
permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          # This repo is not in the HACS default store — it is installed as a custom repository — so
          # the brands check (which requires a PR against home-assistant/brands) would fail on
          # something we have deliberately not done.
          ignore: brands

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pipx install ruff
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements_test.txt
      # pytest-homeassistant-custom-component pulls in a real Home Assistant, so these are not mocks
      # of HA — the config flow, the coordinator and the entities run inside the actual thing.
      - run: pytest
