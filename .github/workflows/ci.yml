# CI for both collector tiers. The steps are carried over from the app repo's ci.yml so nothing
# regresses in the move — the agent job's pinned shellcheck and the ar-less .ipk build both exist
# because of failures documented there.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # hub-lite (agent/): POSIX-sh parser tests with hardware-captured fixtures, plus shellcheck at
  # error severity. dash (ubuntu's sh) doubles as a busybox-ash POSIX check.
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Agent parser tests
        run: sh agent/test.sh
      - name: Install shellcheck
        env:
          SC_VERSION: v0.11.0
          SC_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SC_VERSION}/shellcheck-${SC_VERSION}.linux.x86_64.tar.xz"
          echo "${SC_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          echo "/tmp/shellcheck-${SC_VERSION}" >> "$GITHUB_PATH"
      - name: Shellcheck
        run: shellcheck --severity=error --shell=sh agent/brvg-agent.sh agent/setup-usb-gps.sh agent/test.sh agent/package/build-ipk.sh agent/package/build-feed.sh agent/hub/install.sh
      - name: Build agent package
        run: sh agent/package/build-ipk.sh
      # The feed index is the signed artifact: prove the index describes the package just built,
      # and that the builder REFUSES to emit an unsigned feed unless explicitly overridden.
      - name: Build agent feed index (and prove it refuses to go unsigned)
        run: |
          ALLOW_UNSIGNED=1 sh agent/package/build-feed.sh
          grep -q '^SHA256sum: ' dist/Packages
          grep -q "^Version: $(sed -n 's/^AGENT_VERSION="\([^"]*\)".*/\1/p' agent/brvg-agent.sh)" dist/Packages
          if sh agent/package/build-feed.sh >/dev/null 2>&1; then
            echo "build-feed.sh produced an UNSIGNED feed without ALLOW_UNSIGNED" >&2
            exit 1
          fi
