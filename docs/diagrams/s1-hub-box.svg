<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 302" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>1 · Hub on a Pi or Docker box</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="960" height="302" rx="14" fill="#0b0f19"/><text x="30" y="40" fill="#e2e8f0" font-size="17" font-weight="800">1 · Hub on a Pi or Docker box</text><rect x="798.5" y="22" width="121.5" height="24" rx="12" fill="none" stroke="#34d399" stroke-width="1.3"/><text x="859.25" y="38.5" text-anchor="middle" fill="#34d399" font-size="11.5" font-weight="600">Available today</text><rect x="35" y="95" width="190" height="105" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/><text x="130.0" y="125" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">🌊 🔋 ⚡ 🌡️</text><text x="130.0" y="146" text-anchor="middle" fill="#94a3b8" font-size="12">sensors on the boat's Wi-Fi</text><text x="130.0" y="163" text-anchor="middle" fill="#94a3b8" font-size="12">webhooks to the LAN</text><rect x="295" y="95" width="215" height="105" rx="12" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="1.5"/><text x="402.5" y="125" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">📦 hub</text><text x="402.5" y="146" text-anchor="middle" fill="#94a3b8" font-size="12">Raspberry Pi · Docker</text><text x="402.5" y="163" text-anchor="middle" fill="#94a3b8" font-size="12">hub/ in this repo</text><rect x="575" y="95" width="160" height="105" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/><text x="655.0" y="125" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">🛜 any router</text><text x="655.0" y="146" text-anchor="middle" fill="#94a3b8" font-size="12">marina Wi-Fi, cellular,</text><text x="655.0" y="163" text-anchor="middle" fill="#94a3b8" font-size="12">home internet</text><rect x="795" y="95" width="140" height="105" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/><text x="865.0" y="125" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">☁️ Guardian</text><text x="865.0" y="146" text-anchor="middle" fill="#94a3b8" font-size="12">Cloud</text><path d="M 225 147 L 290 147" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ar)"/><path d="M 510 147 L 570 147" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ar)"/><text x="540.0" y="138" text-anchor="middle" fill="#94a3b8" font-size="12">one roll-up</text><path d="M 735 147 L 790 147" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ar)"/><text x="480" y="262" text-anchor="middle" fill="#94a3b8" font-size="12.5">Sensors hand off on the LAN; the hub batches everything out over whatever internet the boat has. Alarms pass</text><text x="480" y="280" text-anchor="middle" fill="#94a3b8" font-size="12.5">through immediately.</text></svg>