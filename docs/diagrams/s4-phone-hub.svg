<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 302" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>4 · Hub-lite on a phone or tablet</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="960" height="302" rx="14" fill="#0b0f19"/><text x="30" y="40" fill="#e2e8f0" font-size="17" font-weight="800">4 · Hub-lite on a phone or tablet</text><rect x="856.9" y="22" width="63.1" height="24" rx="12" fill="none" stroke="#eab308" stroke-width="1.3"/><text x="888.4499999999999" y="38.5" text-anchor="middle" fill="#eab308" font-size="11.5" font-weight="600">Planned</text><rect x="35" y="95" width="190" height="105" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/><text x="130.0" y="125" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">🌊 🔋 ⚡ 🌡️</text><text x="130.0" y="146" text-anchor="middle" fill="#94a3b8" font-size="12">sensors on the boat's Wi-Fi</text><text x="130.0" y="163" text-anchor="middle" fill="#94a3b8" font-size="12">webhooks to the LAN</text><rect x="295" y="95" width="250" height="105" rx="12" fill="rgba(234,179,8,0.07)" stroke="#eab308" stroke-width="1.5" stroke-dasharray="7 5"/><text x="420.0" y="125" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">📱 phone / iPad as a service</text><text x="420.0" y="146" text-anchor="middle" fill="#94a3b8" font-size="12">collects while aboard —</text><text x="420.0" y="163" text-anchor="middle" fill="#94a3b8" font-size="12">and can be the hotspot itself</text><rect x="795" y="95" width="140" height="105" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/><text x="865.0" y="125" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">☁️ Guardian</text><text x="865.0" y="146" text-anchor="middle" fill="#94a3b8" font-size="12">Cloud</text><path d="M 225 147 L 290 147" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ar)"/><path d="M 545 147 L 790 147" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="4 5" marker-end="url(#ar)"/><text x="667.5" y="138" text-anchor="middle" fill="#94a3b8" font-size="12">over its own LTE</text><text x="480" y="262" text-anchor="middle" fill="#94a3b8" font-size="12.5">For boats with no fixed connectivity: the phone that's aboard anyway is both the uplink and the collector.</text></svg>