<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 302" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>Shared hub at the marina</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="960" height="302" rx="14" fill="#0b0f19"/><text x="30" y="40" fill="#e2e8f0" font-size="17" font-weight="800">5 · Shared hub at the marina — one collector, many boats</text><rect x="845" y="22" width="63.1" height="24" rx="12" fill="none" stroke="#eab308" stroke-width="1.3"/><text x="876.55" y="38.5" text-anchor="middle" fill="#eab308" font-size="11.5" font-weight="600">Planned</text><rect x="35" y="78" width="165" height="48" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/><text x="117.5" y="107.0" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">⛵ slip 12</text><rect x="35" y="140" width="165" height="48" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/><text x="117.5" y="169.0" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">⛵ slip 13</text><rect x="35" y="202" width="165" height="48" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/><text x="117.5" y="231.0" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">⛵ slip 14</text><rect x="360" y="105" width="250" height="110" rx="12" fill="rgba(234,179,8,0.07)" stroke="#eab308" stroke-width="1.5" stroke-dasharray="7 5"/><text x="485.0" y="135" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">🏢 marina office hub</text><text x="485.0" y="156" text-anchor="middle" fill="#94a3b8" font-size="12">long-range (LoRa-class) sensors</text><text x="485.0" y="173" text-anchor="middle" fill="#94a3b8" font-size="12">reach it from every slip — no Wi-Fi aboard</text><rect x="795" y="108" width="140" height="105" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/><text x="865.0" y="138" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">☁️ Guardian</text><text x="865.0" y="159" text-anchor="middle" fill="#94a3b8" font-size="12">Cloud</text><path d="M 200 102 C 270 102, 300 160, 355 160" fill="none" stroke="rgba(56,189,248,0.55)" stroke-width="2" stroke-dasharray="2 5"/><path d="M 200 164 C 270 164, 300 160, 355 160" fill="none" stroke="rgba(56,189,248,0.55)" stroke-width="2" stroke-dasharray="2 5"/><path d="M 200 226 C 270 226, 300 160, 355 160" fill="none" stroke="rgba(56,189,248,0.55)" stroke-width="2" stroke-dasharray="2 5"/><text x="272" y="70" text-anchor="middle" fill="#38bdf8" font-size="12">¼-mile radio links</text><path d="M 610 160 L 790 160" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ar)"/><text x="700.0" y="147" text-anchor="middle" fill="#94a3b8" font-size="12">routed per device id</text><text x="480" y="262" text-anchor="middle" fill="#94a3b8" font-size="12.5">The site provides the hub and uplink once; every boat on the pier gets covered. Routing stays per-device —</text><text x="480" y="280" text-anchor="middle" fill="#94a3b8" font-size="12.5">one hub never mixes boats up.</text></svg>