<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>brvg-hub architecture: one wire contract, two collectors</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="960" height="410" rx="14" fill="#0b0f19"/><text x="480" y="42" text-anchor="middle" fill="#e2e8f0" font-size="19" font-weight="800">One wire contract, two collectors</text><rect x="40" y="78" width="200" height="272" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/><text x="140.0" y="108" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">On-board hardware</text><rect x="58" y="126" width="164" height="32" rx="7" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)"/><text x="140" y="147" text-anchor="middle" fill="#e2e8f0" font-size="12">🌊 flood / high water</text><rect x="58" y="168" width="164" height="32" rx="7" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)"/><text x="140" y="189" text-anchor="middle" fill="#e2e8f0" font-size="12">🔋 battery voltage</text><rect x="58" y="210" width="164" height="32" rx="7" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)"/><text x="140" y="231" text-anchor="middle" fill="#e2e8f0" font-size="12">⚡ shore power</text><rect x="58" y="252" width="164" height="32" rx="7" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)"/><text x="140" y="273" text-anchor="middle" fill="#e2e8f0" font-size="12">🌡️ temp / humidity</text><rect x="58" y="294" width="164" height="32" rx="7" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)"/><text x="140" y="315" text-anchor="middle" fill="#e2e8f0" font-size="12">📍 GPS (NMEA / GNSS)</text><rect x="340" y="100" width="280" height="92" rx="12" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="1.5"/><text x="480.0" y="130" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">hub  (TypeScript)</text><text x="480.0" y="151" text-anchor="middle" fill="#94a3b8" font-size="12">Raspberry Pi · Docker · desktop</text><text x="480.0" y="168" text-anchor="middle" fill="#94a3b8" font-size="12">receiver + roll-up + NMEA GPS + growth path</text><rect x="340" y="240" width="280" height="92" rx="12" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-width="1.5"/><text x="480.0" y="270" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">hub-lite  (hub-lite, shell)</text><text x="480.0" y="291" text-anchor="middle" fill="#94a3b8" font-size="12">GL.iNet / OpenWrt-class routers</text><text x="480.0" y="308" text-anchor="middle" fill="#94a3b8" font-size="12">receive-and-forward + modem &amp; GPS telemetry</text><text x="480" y="222" text-anchor="middle" fill="#94a3b8" font-size="12.5">hub-lite ⊂ hub — same batch format, shared test fixtures</text><rect x="730" y="160" width="195" height="110" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/><text x="827.5" y="190" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">☁️ Guardian Cloud</text><text x="827.5" y="211" text-anchor="middle" fill="#94a3b8" font-size="12">one batch endpoint,</text><text x="827.5" y="228" text-anchor="middle" fill="#94a3b8" font-size="12">per-device revocable tokens</text><path d="M 240 160 L 335 140" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ar)"/><text x="287.5" y="131" text-anchor="middle" fill="#94a3b8" font-size="12">LAN webhooks</text><path d="M 240 290 L 335 292" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ar)"/><text x="270" y="316" text-anchor="middle" fill="#94a3b8" font-size="12">LAN webhooks</text><path d="M 620 146 L 726 195" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ar)"/><path d="M 620 286 L 726 240" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ar)"/><text x="678" y="122" text-anchor="middle" fill="#38bdf8" font-size="12.5" font-weight="600">one roll-up per interval</text><text x="690" y="316" text-anchor="middle" fill="#f87171" font-size="12.5" font-weight="600">alarms jump the queue — never batched</text><text x="480" y="386" text-anchor="middle" fill="#94a3b8" font-size="12">Outbound HTTPS only — nothing listens on the WAN (CGNAT-friendly). A reboot is a new boot id, never a replay.</text></svg>